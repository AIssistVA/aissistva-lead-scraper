version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: b2b-lead-scraper-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build: .
    container_name: b2b-lead-scraper-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///leads.db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-this-in-production
      - DEBUG=False
      - SCRAPING_DELAY=2
      - MAX_LEADS_PER_SOURCE=20
      - REQUEST_TIMEOUT=10
      - EMAIL_VALIDATION_ENABLED=True
      - EXPORT_DIR=exports
    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs
      - app_data:/app/instance
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery-worker:
    build: .
    container_name: b2b-lead-scraper-celery
    command: celery -A app.celery worker --loglevel=info
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///leads.db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-this-in-production
      - DEBUG=False
    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs
      - app_data:/app/instance
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  app_data:
    driver: local